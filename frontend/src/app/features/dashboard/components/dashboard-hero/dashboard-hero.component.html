<div class="hero-card">

    <p class="eyebrow">Pilotage des projets</p>
    <h1>MPMT</h1>

      Crée un projet, ajoute des tâches, filtre par projet et suis l’avancement
      par colonnes.
    </p>
  </div>

  <div class="hero-stats">
    <article>

      <strong>{{ totalTasks() }}</strong>
      <span>tâches visibles</span>

      <span>terminées</span>
    </article>
  </div>
</div>
