<section class="panel-card">
  <div class="panel-head">
    <h2>Filtres</h2>
    <button class="ghost-button" type="button" (click)="refreshRequested.emit()" data-testid="dashboard-refresh">Actualiser</button>
  </div>

  <div class="project-filter-list">
    <button
      type="button"
      [class.active]="selectedProjectId() === 'all'"
      (click)="projectSelected.emit('all')"
      data-testid="project-filter-all"
    >
      Tous les projets
    </button>

    @for (project of projects(); track project.id) {
      <button
        type="button"
        [class.active]="selectedProjectId() === project.id"
        (click)="projectSelected.emit(project.id)"
        [attr.data-testid]="'project-filter-' + project.id"
      >
        {{ projectLabel(project) }}
      </button>
    }
  </div>
</section>
